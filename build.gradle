plugins {
	id 'fabric-loom' version '1.18.2'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

test {
	useJUnitPlatform()
}

// Client-visible changes ship as a jar, and compileJava alone never refreshes it.
// gradle deployClient rebuilds, copies build/libs/infusedclasses-<version>.jar to the
// live instance mods folder, and fails loudly if the jar is missing afterwards.
// Override the target with -PmcModsDir=<path> or the MC_MODS_DIR env var.
def mcModsDir = findProperty('mcModsDir') ?: System.getenv('MC_MODS_DIR') ?:
		"${System.getProperty('user.home')}/.local/share/ElyPrismLauncher/instances/1.21.11/minecraft/mods"

tasks.register('deployClient', Copy) {
	group = 'infusedclasses'
	description = 'Rebuilds the mod jar and copies it to the client mods folder.'
	dependsOn build
	from(layout.buildDirectory.dir('libs')) {
		include "infusedclasses-${project.version}.jar"
	}
	into mcModsDir
	doLast {
		def target = file("${mcModsDir}/infusedclasses-${project.version}.jar")
		if (!target.exists()) {
			throw new GradleException("deployClient: jar missing at ${target}")
		}
		logger.lifecycle("deployClient: ${target} (${target.length()} bytes)")
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}