pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'fabric-loom' version '1.18.2'
	}
}

rootProject.name = 'infusedclasses'

include 'common'

['1.21.1': 'mc1211', '26.3': 'mc263'].each { gameVersion, moduleName ->
	include moduleName
	project(":${moduleName}").projectDir = file("versions/${gameVersion}")
}
