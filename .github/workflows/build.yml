name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          # fabric-loom 1.18.2 requires a Java 25 JVM to run; the mod still targets Java 21.
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: license-agreement
        run: |
          grep -q "All Rights Reserved" LICENSE
          grep -q "All Rights Reserved" README.md
          grep -q '"license": "ARR"' src/main/resources/fabric.mod.json
          if grep -rnw "MIT" LICENSE README.md src/main/resources/fabric.mod.json; then
            echo "license-agreement: stale MIT reference in license metadata"; exit 1
          fi
      # ./gradlew: the wrapper is the single source of the Gradle version.
      - run: ./gradlew build --info
      - run: tools/mixin-targets.sh
